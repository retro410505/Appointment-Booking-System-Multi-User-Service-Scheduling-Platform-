{% extends 'base.html' %}
{% block title %}Edit Service{% endblock %}
{% block content %}
<h2>Edit Service: {{ service.name }}</h2>
<form method="POST" style="background: var(--color-surface); border: 1px solid var(--color-border); padding: 1.5rem; border-radius: var(--radius-md); margin-top: 1rem;">
    <label>Service Name:</label>
    <input type="text" name="name" value="{{ service.name }}" required style="width: 100%; padding: 0.5rem; margin-bottom: 1rem;">

    <label>Category:</label>
    <input type="text" name="category" value="{{ service.category }}" required style="width: 100%; padding: 0.5rem; margin-bottom: 1rem;">

    <label>Description:</label>
    <textarea name="description" style="width: 100%; padding: 0.5rem; margin-bottom: 1rem;">{{ service.description }}</textarea>

    <label>Duration (minutes):</label>
    <input type="number" name="duration_minutes" value="{{ service.duration_minutes }}" required style="width: 100%; padding: 0.5rem; margin-bottom: 1rem;">

    <label>Price ($):</label>
    <input type="number" step="0.01" name="price" value="{{ service.price }}" required style="width: 100%; padding: 0.5rem; margin-bottom: 1rem;">

    <button type="submit" style="background: var(--color-primary); color: white; border: none; padding: 0.5rem 1rem; border-radius: var(--radius-sm); cursor: pointer;">Save Changes</button>
</form>
{% endblock %}
